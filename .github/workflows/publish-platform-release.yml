name: Publish platform update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic platform version"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: true
        type: string
      run_migrations:
        description: "The release contains database migrations"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo, pdo_mysql, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            resources/admin/package-lock.json
            resources/admin-react/package-lock.json
      - name: Install and build admin assets
        working-directory: resources/admin
        run: npm ci && npm run build
      - name: Build React installer assets
        working-directory: resources/admin-react
        run: npm ci && npm run build:installer
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare signing key
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/flex-update-private.key"
      - name: Build platform artifact
        run: >-
          php bin/flex platform:build
          --target-version "${{ inputs.version }}"
          --private-key-file "$RUNNER_TEMP/flex-update-private.key"
          --key-id "${{ vars.UPDATE_SIGNING_KEY_ID }}"
          ${{ inputs.run_migrations && '--run-migrations' || '' }}
          --output "updates/platform/releases/${{ inputs.version }}/flex-cms-${{ inputs.version }}.zip"
      - name: Create and sign catalog entry
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 scripts/release_catalog.py create \
            --type platform --package flex-cms --version "${{ inputs.version }}" \
            --artifact "updates/platform/releases/${{ inputs.version }}/flex-cms-${{ inputs.version }}.zip" \
            --base-url https://updates-flex-cms.kriskata.com --minimum-php '>=8.3' \
            --compatible-from '>=0.1.0 <1.0.0' --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --release-notes "$RELEASE_NOTES" --output "$RUNNER_TEMP/release.json"
          php bin/flex updates:sign-manifest "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/signed-release.json" \
            --private-key-file "$RUNNER_TEMP/flex-update-private.key" --key-id "${{ vars.UPDATE_SIGNING_KEY_ID }}"
      - name: Publish catalog last
        run: |
          mkdir -p updates/platform
          if [ ! -f updates/platform/manifest.json ]; then
            printf '{"schema":1,"releases":[]}\n' > updates/platform/manifest.json
          fi
          python3 scripts/release_catalog.py merge --catalog updates/platform/manifest.json --release "$RUNNER_TEMP/signed-release.json"
      - name: Deploy platform artifacts to shared hosting
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz
          path: updates/platform/releases/
          remote_path: ${{ vars.UPDATE_DEPLOY_PATH }}/platform/releases/
          remote_host: ${{ vars.UPDATE_DEPLOY_HOST }}
          remote_user: ${{ vars.UPDATE_DEPLOY_USER }}
          remote_key: ${{ secrets.UPDATE_DEPLOY_SSH_KEY }}
      - name: Deploy catalog last
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz
          path: updates/platform/manifest.json
          remote_path: ${{ vars.UPDATE_DEPLOY_PATH }}/platform/manifest.json
          remote_host: ${{ vars.UPDATE_DEPLOY_HOST }}
          remote_user: ${{ vars.UPDATE_DEPLOY_USER }}
          remote_key: ${{ secrets.UPDATE_DEPLOY_SSH_KEY }}
      - name: Record release in Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f updates/platform/manifest.json
          git add scripts/release_catalog.py
          git commit -m "Publish platform ${{ inputs.version }} update"
          git push
