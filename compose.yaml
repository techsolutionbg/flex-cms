name: flex-cms

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
      - "${PUBLIC_PORT:-8088}:80"
    group_add:
      - "${FLEX_CMS_GID:-33}"
    environment:
      APP_ENV: local
      FLEX_CMS_GID: "${FLEX_CMS_GID:-33}"
      THEMES_PATH: "${THEMES_PATH:-themes}"
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-localhost,127.0.0.1,app}"
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-flex_cms}"
      DB_USERNAME: "${DB_USERNAME:-flex_cms}"
      DB_PASSWORD: "${DB_PASSWORD:-flex_cms}"
      ADMIN_URL: "${ADMIN_URL:-http://localhost:8090/}"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  updater:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: sh -c 'while :; do php bin/flex updates:process || true; sleep 5; done'
    # Keep atomic updater writes readable by Apache/www-data.
    user: "${FLEX_CMS_UID:-1000}:${FLEX_CMS_GID:-33}"
    group_add:
      - "${FLEX_CMS_GID:-33}"
    environment:
      APP_ENV: local
      UPDATE_HEALTHCHECK_URL: http://app/health
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    restart: unless-stopped

  frontend-react:
    image: node:22-alpine
    working_dir: /workspace/resources/admin-react
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 8090"
    ports:
      - "${VITE_REACT_FORWARD_PORT:-8090}:8090"
    volumes:
      - .:/workspace
      - frontend_react_node_modules:/workspace/resources/admin-react/node_modules
    environment:
      VITE_INSTALLER_SITE_URL: "${INSTALLER_SITE_URL:-http://localhost:8080}"

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: "flex_cms"
      MYSQL_USER: "flex_cms"
      MYSQL_PASSWORD: "${DB_PASSWORD:-flex_cms}"
      MYSQL_ROOT_PASSWORD: "change-me"
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5-apache
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: "${PMA_HOST:-mysql}"
      PMA_PORT: "${PMA_PORT:-3306}"
      PMA_ARBITRARY: "${PMA_ARBITRARY:-0}"
      UPLOAD_LIMIT: "${PMA_UPLOAD_LIMIT:-64M}"
    ports:
      - "${PMA_FORWARD_PORT:-8081}:80"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_FORWARD_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_FORWARD_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mysql_data:
  vendor:
  frontend_react_node_modules:
