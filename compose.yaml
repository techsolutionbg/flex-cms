name: flex-cms

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: local
      VITE_DEV_SERVER_URL: "http://localhost:${VITE_FORWARD_PORT:-5173}"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: node:22-alpine
    working_dir: /workspace/resources/admin
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_FORWARD_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/resources/admin/node_modules
    environment:
      VITE_DEV_SERVER_URL: "http://localhost:${VITE_FORWARD_PORT:-5173}"

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: "flex_cms"
      MYSQL_USER: "flex_cms"
      MYSQL_PASSWORD: "flex_cms"
      MYSQL_ROOT_PASSWORD: "change-me"
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5-apache
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: "${PMA_HOST:-mysql}"
      PMA_PORT: "${PMA_PORT:-3306}"
      PMA_ARBITRARY: "${PMA_ARBITRARY:-0}"
      UPLOAD_LIMIT: "${PMA_UPLOAD_LIMIT:-64M}"
    ports:
      - "${PMA_FORWARD_PORT:-8081}:80"

volumes:
  mysql_data:
  vendor:
  frontend_node_modules:
